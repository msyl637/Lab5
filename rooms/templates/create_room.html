{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Гостиница — добавить номер</title>
    <link rel="stylesheet" href="{% static 'css/room.css' %}">
</head>
<body class="article">
    <div class="article-content">
        <h1>Добавить номер</h1>

        <form method="POST" class="create-form">
            {% csrf_token %}

            <label for="title">Название номера</label>
            <input type="text" id="title" name="title"
                   placeholder="Например: Номер 101"
                   value="{{ form.title|default:'' }}">

            <label for="text">Описание</label>
            <textarea id="text" name="text"
                      placeholder="Вместимость, комфортность, цена...">{{ form.text|default:'' }}</textarea>

            <input type="submit" value="Сохранить">

            {% if form.errors %}
                <p class="form-error">{{ form.errors }}</p>
            {% endif %}
        </form>

        <p class="article-back">
            <a href="{% url 'archive' %}">← Все записи</a>
        </p>
    </div>
</body>
</html>
